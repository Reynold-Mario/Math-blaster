name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # All four are listed because naming `types` at all REPLACES the default
    # set - drop opened/synchronize/reopened and ordinary CI stops running.
    #
    # `edited` is here for stacked PRs. Retargeting a PR's base fires only
    # `edited`, so without it a PR opened against another branch and later
    # pointed at main never gets a run: its pushes were filtered out by
    # `branches: [main]` while the base was still elsewhere, and the retarget
    # itself triggered nothing. That left a green-looking PR with no CI on it,
    # mergeable only by closing and reopening it to fake a `reopened` event.
    #
    # The cost is that `edited` also covers title and body edits - there is no
    # base-only activity type - so editing a description runs CI too. That is
    # cheap here (a ~20s job, and the concurrency group above cancels the
    # previous run for the same ref) and is deliberately NOT guarded with a
    # job-level `if:`. "Build, Check & Test" is a required status check on
    # main, and a required check that reports as skipped can block a merge.
    types: [opened, synchronize, reopened, edited]

# Read-only by default. Nothing here publishes, comments or pushes, so the
# token has no reason to be able to.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # THE NAME IS LOAD-BEARING. "Build, Check & Test" is the required status
    # check on main, so renaming this job - or splitting it into one job per
    # step, which would otherwise be the tidier shape - leaves branch protection
    # waiting forever on a context that no longer reports. Splitting it needs
    # the protection rule updated in the same change; see todo.md 2.3.
    name: Build, Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint runs first: it is the cheapest gate and, unlike the two below, it
      # depends on nothing having been bundled or type-checked.
      #
      # This is a STEP rather than a job only because the job name is a required
      # status check - see the note on `name:` above. It becomes its own `Lint`
      # job in the split (todo.md 2.3b), which is also what stops "Build, Check &
      # Test" understating what this job does. Adding it here rather than waiting
      # for the split is deliberate: the alternative leaves a linter in the repo
      # that CI does not run.
      - name: Lint (prettier + eslint)
        run: npm run lint

      # THE JOB WAS CALLED "Build" AND DID NOT BUILD, so a Vite build that
      # failed passed CI and only showed up on someone's machine.
      #
      # Type-checking is not bundling: `npm run check` never invokes Vite, so it
      # cannot see a plugin or config failure, an unresolvable asset, or a
      # Svelte compile error that tsc is happy with. It runs first because it is
      # the cheapest way to fail - no point type-checking code that cannot be
      # bundled.
      #
      # `--workspaces` excludes the root, so a root script calling the same
      # script name in each workspace does not recurse. `--if-present` is what
      # lets a workspace with no `test` (the landing page, when it arrives)
      # sit alongside one that has them, instead of failing the run.
      - name: Build
        run: npm run build --workspaces --if-present

      - name: Type-check (svelte-check + tsc)
        run: npm run check --workspaces --if-present

      - name: Run tests
        run: npm run test --workspaces --if-present -- --ci
