# Dependency updates. Modelled on eng-mcp-server's, which is the best of the
# sibling repos: grouped so a week of patches is one PR rather than nine, and
# split by dependency-type so a production bump is never reviewed with the same
# glance as a devDependency one.
version: 2
updates:
  - package-ecosystem: npm
    # `/`, and the reason INVERTED when the workspace move landed.
    #
    # This used to read `/math-blaster` because there was no root manifest, so
    # `/` would have found nothing and Dependabot would have quietly done
    # nothing at all. The root now declares `workspaces`, so Dependabot follows
    # that field to `games/math-blaster/package.json` and updates the root
    # lockfile alongside it. One entry covers every workspace.
    #
    # Do NOT point this at `/games/math-blaster`, and do not add a second entry
    # for it. THERE IS NO LOCKFILE IN THAT DIRECTORY ANY MORE - only the root
    # has one - so a job aimed there would bump the range in the workspace
    # manifest and leave the lockfile untouched, and every Dependabot PR would
    # fail `npm ci` with EUSAGE. A second entry alongside this one is worse
    # still: both jobs bump the same dependency and burn the PR limit on
    # duplicates. `todo.md` 2.4 predicted the two-entry shape; it was wrong.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # `@supabase/supabase-js` is the only runtime dependency, and it is the
      # one that can break a signed-in player rather than a build. Keeping it
      # out of the dev-tooling group means its bumps are read on their own.
      production-deps:
        dependency-type: production
      development-deps:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Monthly: action versions move slowly, and a stale one fails loudly at
      # the next run rather than silently shipping.
      interval: monthly
    labels:
      - dependencies
      - github-actions
