# Dependency updates. Modelled on eng-mcp-server's, which is the best of the
# sibling repos: grouped so a week of patches is one PR rather than nine, and
# split by dependency-type so a production bump is never reviewed with the same
# glance as a devDependency one.
version: 2
updates:
  - package-ecosystem: npm
    # `/`, and the reason INVERTED when the workspace move landed.
    #
    # This used to read `/math-blaster` because there was no root manifest, so
    # `/` would have found nothing and Dependabot would have quietly done
    # nothing at all. The root now declares `workspaces`, so Dependabot follows
    # that field to `games/math-blaster/package.json` and updates the root
    # lockfile alongside it. One entry covers every workspace.
    #
    # Do NOT add a per-workspace entry alongside this one. THERE IS NO LOCKFILE
    # IN ANY WORKSPACE DIRECTORY - only the root has one - so a job aimed at
    # `games/math-blaster` or `apps/web` would bump the range in that manifest
    # and leave the lockfile untouched, and every Dependabot PR it opened would
    # fail `npm ci` with EUSAGE. It is also how the two workspaces' shared
    # devDependency ranges would drift apart, and they must not: `svelte`,
    # `vite` and `typescript` are declared in both, and npm hoists ONE copy
    # only while a single version satisfies both ranges. Bump one and not the
    # other and you get two Svelte compilers and a class of bug nobody
    # diagnoses from the symptom. `todo.md` 2.4 predicted a per-workspace
    # entry; it was wrong.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # `@supabase/supabase-js` is the only runtime dependency, and it is the
      # one that can break a signed-in player rather than a build. Keeping it
      # out of the dev-tooling group means its bumps are read on their own.
      production-deps:
        dependency-type: production
      development-deps:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Monthly: action versions move slowly, and a stale one fails loudly at
      # the next run rather than silently shipping.
      interval: monthly
    labels:
      - dependencies
      - github-actions
